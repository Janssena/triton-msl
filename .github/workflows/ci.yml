name: CI

# GPU / Metal correctness is validated LOCALLY, not in hosted CI. Triton publishes no
# macOS wheels, and building it from source on a GitHub-hosted macOS runner exceeds the
# runner time limit (>60 min — it never finishes), so the Triton-dependent suite can't run
# on hosted runners. Before pushing, run BOTH local jobs on Apple Silicon with a
# source-built Triton: python scripts/run_project_tests.py --output /absolute/new/evidence
# Bare `pytest tests/` is correctness-only; floor success is not controlled performance
# qualification. See CONTRIBUTING.md "Running Tests" and docs/VALIDATION_LANES.md.
# Hosted CI gates on lint only. GPU runner deployment/qualification is separate;
# a future trusted GPU job must schedule both lanes and keep their outcomes distinct.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 (Node 24)

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (Node 24)
        with:
          python-version: '3.12'

      - name: Install ruff
        # PINNED: ruff's formatter changes between releases, so an unpinned install
        # makes `ruff format --check` drift and fail as new ruff versions ship. Bump this
        # deliberately (and re-run `ruff format triton_msl/ tests/`) rather than floating.
        run: pip install ruff==0.14.14

      - name: Lint
        run: ruff check triton_msl/ tests/

      - name: Format check
        run: ruff format --check triton_msl/ tests/
